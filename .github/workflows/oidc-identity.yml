name: OIDC identity verification
on:
  push:
    paths: ['src/**','tests/**','pyproject.toml','.github/workflows/oidc-identity.yml']
  pull_request:
    paths: ['src/**','tests/**','pyproject.toml','.github/workflows/oidc-identity.yml']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyJWT[crypto]==2.10.1'
      - run: PYTHONPATH=src python -m unittest tests.test_oidc -v
