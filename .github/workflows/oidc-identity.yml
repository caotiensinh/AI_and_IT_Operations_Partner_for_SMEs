name: OIDC identity verification
on:
  push:
    paths: ['src/**','tests/**','pyproject.toml','.github/workflows/oidc-identity.yml']
  pull_request:
    paths: ['src/**','tests/**','pyproject.toml','.github/workflows/oidc-identity.yml']
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'httpx2>=2.0,<3'
      - run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_oidc*.py' -v
