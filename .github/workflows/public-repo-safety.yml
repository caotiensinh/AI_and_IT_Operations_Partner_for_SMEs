name: Public repository tracked-file safety
on:
  push:
    paths:
      - '**'
  pull_request:
    paths:
      - '**'
permissions:
  contents: read
jobs:
  tracked-file-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the detector with positive and negative fixtures
        run: python -m unittest discover -s tests -p test_public_repo_safety.py -v
      - name: Inspect the complete tracked checkout
        run: python scripts/check_public_repo_safety.py
