name: Discovery Workspace UI
on:
  push:
    paths:
      - 'web/discovery/**'
      - '.github/workflows/discovery-workspace-ui.yml'
  pull_request:
    paths:
      - 'web/discovery/**'
      - '.github/workflows/discovery-workspace-ui.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/discovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check and production build
        run: npm run build
