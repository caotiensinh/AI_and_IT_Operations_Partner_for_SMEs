name: Production readiness manifest contract
on:
  push:
    paths:
      - "release/readiness.json"
      - "scripts/check_release_readiness.py"
      - "tests/test_release_readiness.py"
      - ".github/workflows/release-readiness.yml"
  pull_request:
    paths:
      - "release/readiness.json"
      - "scripts/check_release_readiness.py"
      - "tests/test_release_readiness.py"
      - ".github/workflows/release-readiness.yml"
permissions:
  contents: read
jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_release_readiness.py -v
      - run: python scripts/check_release_readiness.py
      # Production deployments must separately invoke --check-production;
      # a blocked release is a successful *contract* check, NOT release approval.
