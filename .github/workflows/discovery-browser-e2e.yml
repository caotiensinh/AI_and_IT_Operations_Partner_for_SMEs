name: Discovery Real Browser E2E
on:
  push:
    paths:
      - 'scripts/discovery_e2e_*.py'
      - 'web/discovery/**'
      - 'src/sme_partner/discovery_api.py'
      - 'migrations/**'
      - '.github/workflows/discovery-browser-e2e.yml'
  pull_request:
    paths:
      - 'scripts/discovery_e2e_*.py'
      - 'web/discovery/**'
      - 'src/sme_partner/discovery_api.py'
      - 'migrations/**'
      - '.github/workflows/discovery-browser-e2e.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sme_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SME_TEST_DATABASE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sme_test
      SME_E2E_ONLY: '1'
      SME_E2E_FIXTURE_PATH: /tmp/sme-discovery-e2e-session.json
      DISCOVERY_API_ORIGIN: http://127.0.0.1:8000
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        run: python -m pip install -e . 'psycopg[binary]>=3.2,<4' 'uvicorn>=0.30,<1'
      - name: Provision disposable PostgreSQL and synthetic test session
        run: python scripts/discovery_e2e_seed.py
      - name: Start loopback-only real API
        run: |
          python scripts/discovery_e2e_server.py > /tmp/sme-e2e-server.log 2>&1 &
          echo $! > /tmp/sme-e2e-server.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "FastAPI failed to start" >&2
          tail -50 /tmp/sme-e2e-server.log >&2
          exit 1
      - name: Install frontend dependencies
        working-directory: web/discovery
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser
        working-directory: web/discovery
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end against PostgreSQL + FastAPI
        working-directory: web/discovery
        run: npm run test:e2e
      - name: Stop loopback API and remove ephemeral bearer fixture
        if: always()
        run: |
          if [ -f /tmp/sme-e2e-server.pid ]; then kill "$(cat /tmp/sme-e2e-server.pid)" || true; fi
          rm -f "$SME_E2E_FIXTURE_PATH" /tmp/sme-e2e-server.pid
