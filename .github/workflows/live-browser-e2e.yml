name: Live browser PostgreSQL E2E
on:
  push:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'frontend/tests/browser_e2e.mjs'
      - '.github/workflows/live-browser-e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'src/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'frontend/tests/browser_e2e.mjs'
      - '.github/workflows/live-browser-e2e.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sme_browser
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SME_TEST_DATABASE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sme_browser
      SME_E2E_FIXTURE_MODE: disposable_ci_only
      SME_E2E_FIXTURE_PATH: /tmp/sme-browser-fixture.json
      PYTHONPATH: src
      SME_E2E_SCREENSHOT_DIR: ${{ github.workspace }}/evidence/browser
      CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API and browser Python dependencies
        run: python -m pip install -e . 'psycopg[binary]>=3.2,<4' 'uvicorn>=0.30,<1'
      - name: Install frontend and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Provision disposable tenant fixtures
        run: python scripts/seed_browser_e2e.py
      - name: Start backend and frontend on loopback
        run: |
          python scripts/run_e2e_api.py >/tmp/sme-api.log 2>&1 &
          cd frontend
          npm run dev -- --host 127.0.0.1 >/tmp/sme-ui.log 2>&1 &
      - name: Verify API and Vite readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/openapi.json >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -80 /tmp/sme-api.log /tmp/sme-ui.log
          exit 1
      - name: Browser cross-tenant tests
        run: node tests/browser_e2e.mjs
        working-directory: frontend
      - name: Verify 13 screenshot files against source SHA and manifest
        run: |
          python scripts/validate_browser_evidence.py evidence/browser --sha "$CI_SOURCE_SHA"
          echo "CAPTURE_INTEGRITY=PASS; archive and independent review remain separate" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate 13 PNG captures and package with checksums
        run: |
          python -m unittest discover -s tests -p test_browser_evidence_package.py -v
          python scripts/package_browser_evidence.py \
            --directory evidence/browser \
            --output evidence/browser-evidence.zip \
            --source-sha "$CI_SOURCE_SHA"
      - name: Upload real-browser synthetic fixture screenshots
        id: screenshot_archive
        if: always()
        # This is a required evidence artifact: upload failure must fail the job.
        uses: actions/upload-artifact@v4
        with:
          name: sme-real-browser-synthetic-ci-evidence
          path: |
            evidence/browser/
            evidence/browser-evidence.zip
          retention-days: 14
          if-no-files-found: error
      - name: Report evidence archival result
        if: always()
        run: |
          if [ "${{ steps.screenshot_archive.outcome }}" != "success" ]; then
            echo "::error::Screenshot artifact archive failed: UI evidence unavailable. CI must fail closed."
            echo "EVIDENCE_ARCHIVE=FAILED — No durable UI screenshots; approval prohibited." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "EVIDENCE_ARCHIVE=UPLOADED — Review images and SHA independently before any acceptance." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Diagnostics on failure
        if: failure()
        run: tail -n 100 /tmp/sme-api.log /tmp/sme-ui.log || true
