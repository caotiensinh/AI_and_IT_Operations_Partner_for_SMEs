name: Branch consolidation inventory (read-only)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/inventory_branches.py"
      - "tests/test_inventory_branches.py"
      - ".github/workflows/branch-inventory.yml"
permissions:
  contents: read
jobs:
  inventory:
    name: Branch inventory
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_inventory_branches.py -v
      - name: GitHub branch ancestry audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/inventory_branches.py
