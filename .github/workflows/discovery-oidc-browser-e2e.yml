name: Discovery OIDC Authorization Code Browser E2E
on:
  push:
    paths:
      - 'scripts/discovery_oidc_e2e_*.py'
      - 'scripts/discovery_cookie_e2e_server.py'
      - 'scripts/discovery_e2e_seed.py'
      - 'web/discovery/**'
      - 'src/sme_partner/oidc*.py'
      - 'src/sme_partner/discovery_bff.py'
      - 'migrations/**'
      - '.github/workflows/discovery-oidc-browser-e2e.yml'
  pull_request:
    paths:
      - 'scripts/discovery_oidc_e2e_*.py'
      - 'scripts/discovery_cookie_e2e_server.py'
      - 'scripts/discovery_e2e_seed.py'
      - 'web/discovery/**'
      - 'src/sme_partner/oidc*.py'
      - 'src/sme_partner/discovery_bff.py'
      - 'migrations/**'
      - '.github/workflows/discovery-oidc-browser-e2e.yml'
permissions:
  contents: read
jobs:
  oidc-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sme_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SME_TEST_DATABASE_DSN: postgresql://postgres:postgres@127.0.0.1:5432/sme_test
      SME_E2E_ONLY: '1'
      SME_E2E_COOKIE_MODE: '1'
      SME_E2E_OIDC_MODE: '1'
      SME_E2E_FIXTURE_PATH: /tmp/sme-oidc-e2e.json
      SME_E2E_IDP_KEY: /tmp/sme-oidc-e2e-idp.pem
      SME_E2E_IDP_JWKS: /tmp/sme-oidc-e2e-idp-jwks.json
      DISCOVERY_API_ORIGIN: http://127.0.0.1:8001
      DISCOVERY_TLS_CERT: /tmp/sme-oidc-e2e-tls.pem
      DISCOVERY_TLS_KEY: /tmp/sme-oidc-e2e-tls.key
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create temporary local TLS and random CSRF key
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$DISCOVERY_TLS_KEY" -out "$DISCOVERY_TLS_CERT" \
            -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'
          chmod 600 "$DISCOVERY_TLS_KEY"
          python -c 'import secrets; print(secrets.token_hex(32))' > /tmp/sme-oidc-e2e-csrf.hex
          chmod 600 /tmp/sme-oidc-e2e-csrf.hex
      - name: Install Python dependencies
        run: python -m pip install -e . 'psycopg[binary]>=3.2,<4' 'uvicorn>=0.30,<1' 'python-multipart>=0.0.12,<1'
      - name: Generate one-run RSA signing key and synthetic PostgreSQL identity
        run: |
          python scripts/discovery_oidc_e2e_keys.py
          python scripts/discovery_e2e_seed.py
          echo "SME_E2E_IDP_SUBJECT=$(python -c 'import json,os; print(json.load(open(os.environ["SME_E2E_FIXTURE_PATH"]))["subject"])')" >> "$GITHUB_ENV"
      - name: Start local synthetic IdP and cookie BFF
        run: |
          python scripts/discovery_oidc_e2e_idp.py > /tmp/sme-oidc-e2e-idp.log 2>&1 &
          echo $! > /tmp/sme-oidc-e2e-idp.pid
          export SME_E2E_CSRF_KEY_HEX="$(cat /tmp/sme-oidc-e2e-csrf.hex)"
          python scripts/discovery_cookie_e2e_server.py > /tmp/sme-oidc-e2e-bff.log 2>&1 &
          echo $! > /tmp/sme-oidc-e2e-bff.pid
          for i in $(seq 1 30); do
            status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/auth/session/tenants || true)"
            idp="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8002/oidc-test/authorize || true)"
            if [ "$status" = 401 ] && [ "$idp" = 422 ]; then exit 0; fi
            sleep 1
          done
          tail -50 /tmp/sme-oidc-e2e-bff.log >&2
          tail -50 /tmp/sme-oidc-e2e-idp.log >&2
          exit 1
      - name: Install frontend test dependencies
        working-directory: web/discovery
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: web/discovery
        run: npx playwright install --with-deps chromium
      - name: Run real browser code-PKCE-RS256-cookie-login tests
        working-directory: web/discovery
        run: npx playwright test --config=playwright.oidc.config.ts
      - name: Destroy test-only IdP, bearer fixture and private keys
        if: always()
        run: |
          for service in idp bff; do
            file="/tmp/sme-oidc-e2e-$service.pid"
            if [ -f "$file" ]; then kill "$(cat "$file")" || true; fi
          done
          rm -f "$SME_E2E_FIXTURE_PATH" "$SME_E2E_IDP_KEY" "$SME_E2E_IDP_JWKS" \
            "$DISCOVERY_TLS_KEY" "$DISCOVERY_TLS_CERT" /tmp/sme-oidc-e2e-csrf.hex \
            /tmp/sme-oidc-e2e-idp.pid /tmp/sme-oidc-e2e-bff.pid
