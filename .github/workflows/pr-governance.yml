name: PR governance contract
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  governance:
    name: PR governance contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate agent/human acceptance contract
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: python scripts/check_pr_governance.py
      - name: Run negative policy tests
        run: python -m unittest discover -s tests -p test_pr_governance.py -v
