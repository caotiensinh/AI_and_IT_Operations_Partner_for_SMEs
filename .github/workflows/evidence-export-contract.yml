name: Evidence export contract
on:
  push:
    paths:
      - "scripts/package_browser_evidence.py"
      - "scripts/persist_browser_evidence.py"
      - "scripts/verify_stored_browser_evidence.py"
      - "tests/test_browser_evidence_package.py"
      - "tests/test_persist_browser_evidence.py"
      - "tests/test_verify_stored_browser_evidence.py"
      - ".github/workflows/evidence-export-contract.yml"
  pull_request:
    paths:
      - "scripts/package_browser_evidence.py"
      - "scripts/persist_browser_evidence.py"
      - "tests/test_browser_evidence_package.py"
      - "tests/test_persist_browser_evidence.py"
      - ".github/workflows/evidence-export-contract.yml"
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_browser_evidence_package.py -v
      - run: python -m unittest discover -s tests -p test_persist_browser_evidence.py -v
      - run: python -m unittest discover -s tests -p test_verify_stored_browser_evidence.py -v
