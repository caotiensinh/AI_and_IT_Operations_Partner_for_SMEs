[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
[project]
name = "sme-partner-integration-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyJWT[crypto]==2.10.1", "fastapi>=0.115,<1", "psycopg>=3.2,<4"]
[tool.setuptools.packages.find]
where = ["src"]
